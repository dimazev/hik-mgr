services:
  hik-mgr:
    build: .
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DB_PATH: /app/data/hik-mgr.sqlite
      # .env itself is excluded from the image (see .dockerignore), so
      # anything the app needs at runtime has to be passed through
      # explicitly here — Compose fills in ${...} from the root .env file
      # automatically. Without these, the container silently fell back to
      # the built-in insecure defaults in env.ts instead of what's in .env.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional one-time device seed — safe to leave unset in .env, in
      # which case these all resolve to empty strings and seeding is
      # skipped (see hikDefault() in env.ts).
      HIK_NAME: ${HIK_NAME:-}
      HIK_HOST: ${HIK_HOST:-}
      HIK_PORT: ${HIK_PORT:-}
      HIK_PROTOCOL: ${HIK_PROTOCOL:-}
      HIK_USERNAME: ${HIK_USERNAME:-}
      HIK_PASSWORD: ${HIK_PASSWORD:-}
    volumes:
      # Bind-mounts the whole repo into the container so source edits made
      # on the host are visible inside it immediately. Combined with
      # bootstrap.sh already reinstalling deps and rebuilding from scratch
      # every time the container's process starts, this means a plain
      # `docker compose restart` (which stops and starts the SAME
      # container, re-running its entrypoint) now picks up code changes —
      # no `docker compose up --build` / image rebuild needed for source
      # edits. You only need an actual rebuild when something outside the
      # source tree changes: the Dockerfile itself, or an OS-level package
      # it installs (python3/make/g++/ffmpeg).
      - .:/app
      # node_modules is deliberately carved back out of the bind mount
      # above, mounted directly at each of its four real project-relative
      # locations — without this, the container would see whatever
      # node_modules happens to be sitting in the repo on the host (e.g.
      # from running `yarn install` locally on macOS), and native modules
      # like better-sqlite3 are compiled per-OS/arch — a macOS build won't
      # load inside this Linux container.
      #
      # These have to be four separate mounts, each at its real path —
      # NOT one shared volume symlinked into place from elsewhere. That
      # was tried (a single volume at /node_modules-cache, symlinked in)
      # and broke `yarn install` outright: Node's module resolution calls
      # realpath() on a symlinked module and searches for node_modules
      # folders from THAT real location, not the symlink's location. Once
      # resolution follows the symlink out to /node_modules-cache, nested
      # dependencies (e.g. napi-build-utils, needed by better-sqlite3's
      # own install script) are simply never found — the real hoisted
      # node_modules is back at /app/node_modules, unreachable from
      # outside /app. Node_modules has to physically live at its correct
      # path for this reason, so one-volume-many-symlinks isn't viable
      # here no matter how it's wired up.
      #
      # This used to be `tmpfs` too, on the theory that RAM-backed mounts
      # don't persist across a restart the way a volume does — but tmpfs
      # broke yarn install for a different reason: some Docker setups
      # mount tmpfs `noexec`, and yarn needs to execute the binaries it
      # just installed (esbuild, etc.) to verify them, which failed with
      # EACCES. A regular volume doesn't have that restriction, so "don't
      # persist across restarts" is instead enforced explicitly in
      # bootstrap.sh (which empties these directories before every yarn
      # install) rather than relying on the mount type to provide that.
      - /app/node_modules
      - /app/packages/shared/node_modules
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - ./data:/app/data
    restart: unless-stopped
