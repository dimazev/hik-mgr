services:
  hik-mgr:
    build: .
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DB_PATH: /app/data/hik-mgr.sqlite
      # .env itself is excluded from the image (see .dockerignore), so
      # anything the app needs at runtime has to be passed through
      # explicitly here — Compose fills in ${...} from the root .env file
      # automatically. Without these, the container silently fell back to
      # the built-in insecure defaults in env.ts instead of what's in .env.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # Optional one-time device seed — safe to leave unset in .env, in
      # which case these all resolve to empty strings and seeding is
      # skipped (see hikDefault() in env.ts).
      HIK_NAME: ${HIK_NAME:-}
      HIK_HOST: ${HIK_HOST:-}
      HIK_PORT: ${HIK_PORT:-}
      HIK_PROTOCOL: ${HIK_PROTOCOL:-}
      HIK_USERNAME: ${HIK_USERNAME:-}
      HIK_PASSWORD: ${HIK_PASSWORD:-}
    volumes:
      # Bind-mounts the whole repo into the container so source edits made
      # on the host are visible inside it immediately. Combined with
      # bootstrap.sh already reinstalling deps and rebuilding from scratch
      # every time the container's process starts, this means a plain
      # `docker compose restart` (which stops and starts the SAME
      # container, re-running its entrypoint) now picks up code changes —
      # no `docker compose up --build` / image rebuild needed for source
      # edits. You only need an actual rebuild when something outside the
      # source tree changes: the Dockerfile itself, or an OS-level package
      # it installs (python3/make/g++/ffmpeg).
      - .:/app
      # node_modules is deliberately carved back out of the bind mount
      # above: without this, the container would see whatever node_modules
      # happens to be sitting in the repo on the host (e.g. from running
      # `yarn install` locally on macOS), and native modules like
      # better-sqlite3 are compiled per-OS/arch — a macOS build won't load
      # inside this Linux container.
      #
      # One named volume (`node_modules_cache`) mounted at a single path
      # outside the source tree, /node_modules-cache — bootstrap.sh then
      # symlinks each of the four node_modules locations this workspace
      # needs (root, packages/shared, apps/server, apps/web) into its own
      # subfolder there. This is the "one volume, several subfolders"
      # shape, done via symlinks rather than Docker's `subpath` mount
      # option: `subpath` requires the target subfolder to already exist
      # *inside* the volume before mounting, which a fresh volume doesn't
      # have on its first use — it doesn't get auto-created the way a
      # plain top-level mount does, so `docker compose up` failed with
      # "no such file or directory" the first time this container tried
      # to start. Symlinks avoid that: bootstrap.sh creates the subfolders
      # itself with a plain `mkdir -p`, which works unconditionally.
      #
      # This used to be `tmpfs` instead, on the theory that RAM-backed
      # mounts don't persist across a restart the way a volume does — but
      # tmpfs turned out to break yarn install outright: some Docker
      # setups mount tmpfs `noexec`, and yarn needs to execute the
      # binaries it just installed (esbuild, etc.) to verify them, which
      # failed with EACCES. A regular named volume doesn't have that
      # restriction, so "don't persist across restarts" is instead
      # enforced explicitly in bootstrap.sh (which empties these
      # directories before every yarn install) rather than relying on the
      # mount type itself to provide that.
      - node_modules_cache:/node_modules-cache
      - ./data:/app/data
    restart: unless-stopped

volumes:
  node_modules_cache:
